<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Cute park colour palette</title>
<style>
body{font-family:Arial,sans-serif;background:#FFFDF8;color:#3B2F4F;max-width:760px;margin:24px auto;padding:0 16px}
h1{font-size:22px;margin:0 0 4px} p{margin:0 0 12px;color:#6B5B8C}
h2{font-size:14px;font-weight:normal;color:#6B5B8C;margin:20px 0 8px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:160px;height:104px;border:1px solid #0001;border-radius:12px;padding:10px;text-align:left;cursor:pointer;color:#3B2F4F;display:flex;flex-direction:column;justify-content:flex-end;font:inherit}
.sw.dark{color:#FFF1D6} .sw b{font-size:14px} .sw em{font-style:normal;font-size:10px;opacity:.7;margin-top:1px} .sw span{font-family:Consolas,monospace;font-size:14px;margin-top:2px} .sw i{font-size:11px;font-style:normal;opacity:.7;margin-top:2px}
</style></head><body>
<h1>Cute park colour palette</h1>
<p>Click a colour to copy its code (e.g. 0xFF8A5C), ready to paste into three.js.</p>
<h2>Sky</h2><div class="row"><button class="sw" style="background:#CDE8F6" data-code="0xCDE8F6"><b>Sky mist</b><em>SKY_MIST</em><span>0xCDE8F6</span><i>click to copy</i></button><button class="sw" style="background:#FFE3D0" data-code="0xFFE3D0"><b>Peach cloud</b><em>PEACH_CLOUD</em><span>0xFFE3D0</span><i>click to copy</i></button><button class="sw" style="background:#FF9EB5" data-code="0xFF9EB5"><b>Sunset pink</b><em>SUNSET_PINK</em><span>0xFF9EB5</span><i>click to copy</i></button><button class="sw" style="background:#FFD3B6" data-code="0xFFD3B6"><b>Horizon glow</b><em>HORIZON_GLOW</em><span>0xFFD3B6</span><i>click to copy</i></button></div><h2>Ground</h2><div class="row"><button class="sw" style="background:#A9DDA0" data-code="0xA9DDA0"><b>Meadow</b><em>MEADOW</em><span>0xA9DDA0</span><i>click to copy</i></button><button class="sw" style="background:#D4E8A0" data-code="0xD4E8A0"><b>Sunny hill</b><em>SUNNY_HILL</em><span>0xD4E8A0</span><i>click to copy</i></button><button class="sw" style="background:#6FB583" data-code="0x6FB583"><b>Moss</b><em>MOSS</em><span>0x6FB583</span><i>click to copy</i></button><button class="sw" style="background:#F3DFB8" data-code="0xF3DFB8"><b>Sandy path</b><em>SANDY_PATH</em><span>0xF3DFB8</span><i>click to copy</i></button></div><h2>Trees and flowers</h2><div class="row"><button class="sw" style="background:#7CCDAA" data-code="0x7CCDAA"><b>Mint leaf</b><em>MINT_LEAF</em><span>0x7CCDAA</span><i>click to copy</i></button><button class="sw" style="background:#F7B6C8" data-code="0xF7B6C8"><b>Blossom</b><em>BLOSSOM</em><span>0xF7B6C8</span><i>click to copy</i></button><button class="sw" style="background:#FFD97A" data-code="0xFFD97A"><b>Butter</b><em>BUTTER</em><span>0xFFD97A</span><i>click to copy</i></button><button class="sw" style="background:#B58B6E" data-code="0xB58B6E"><b>Bark</b><em>BARK</em><span>0xB58B6E</span><i>click to copy</i></button></div><h2>Water and buildings</h2><div class="row"><button class="sw" style="background:#8FD3E8" data-code="0x8FD3E8"><b>Pond</b><em>POND</em><span>0x8FD3E8</span><i>click to copy</i></button><button class="sw" style="background:#FFF1D6" data-code="0xFFF1D6"><b>Cream walls</b><em>CREAM_WALLS</em><span>0xFFF1D6</span><i>click to copy</i></button><button class="sw" style="background:#EE8B86" data-code="0xEE8B86"><b>Coral roof</b><em>CORAL_ROOF</em><span>0xEE8B86</span><i>click to copy</i></button></div><h2>Oranges</h2><div class="row"><button class="sw" style="background:#FFC9B0" data-code="0xFFC9B0"><b>Peach blush</b><em>PEACH_BLUSH</em><span>0xFFC9B0</span><i>click to copy</i></button><button class="sw" style="background:#FFC18A" data-code="0xFFC18A"><b>Apricot</b><em>APRICOT</em><span>0xFFC18A</span><i>click to copy</i></button><button class="sw" style="background:#F5B04C" data-code="0xF5B04C"><b>Honey</b><em>HONEY</em><span>0xF5B04C</span><i>click to copy</i></button><button class="sw" style="background:#FF9F5A" data-code="0xFF9F5A"><b>Tangerine</b><em>TANGERINE</em><span>0xFF9F5A</span><i>click to copy</i></button><button class="sw" style="background:#FF8A5C" data-code="0xFF8A5C"><b>Sunset orange</b><em>SUNSET_ORANGE</em><span>0xFF8A5C</span><i>click to copy</i></button><button class="sw" style="background:#E8743B" data-code="0xE8743B"><b>Pumpkin</b><em>PUMPKIN</em><span>0xE8743B</span><i>click to copy</i></button></div><h2>Blues</h2><div class="row"><button class="sw" style="background:#E3F2FB" data-code="0xE3F2FB"><b>Ice</b><em>ICE</em><span>0xE3F2FB</span><i>click to copy</i></button><button class="sw" style="background:#8EC9F0" data-code="0x8EC9F0"><b>Sky blue</b><em>SKY_BLUE</em><span>0x8EC9F0</span><i>click to copy</i></button><button class="sw" style="background:#9DB4F0" data-code="0x9DB4F0"><b>Periwinkle</b><em>PERIWINKLE</em><span>0x9DB4F0</span><i>click to copy</i></button><button class="sw" style="background:#3E8E9E" data-code="0x3E8E9E"><b>Deep teal</b><em>DEEP_TEAL</em><span>0x3E8E9E</span><i>click to copy</i></button><button class="sw" style="background:#5B7DB8" data-code="0x5B7DB8"><b>Dusk blue</b><em>DUSK_BLUE</em><span>0x5B7DB8</span><i>click to copy</i></button><button class="sw dark" style="background:#2F3A6B" data-code="0x2F3A6B"><b>Midnight</b><em>MIDNIGHT</em><span>0x2F3A6B</span><i>click to copy</i></button></div><h2>Purples</h2><div class="row"><button class="sw" style="background:#C7B3EC" data-code="0xC7B3EC"><b>Lavender</b><em>LAVENDER</em><span>0xC7B3EC</span><i>click to copy</i></button><button class="sw" style="background:#D9A8E6" data-code="0xD9A8E6"><b>Orchid</b><em>ORCHID</em><span>0xD9A8E6</span><i>click to copy</i></button><button class="sw" style="background:#B9A3E3" data-code="0xB9A3E3"><b>Wisteria</b><em>WISTERIA</em><span>0xB9A3E3</span><i>click to copy</i></button><button class="sw" style="background:#C79BC0" data-code="0xC79BC0"><b>Mauve</b><em>MAUVE</em><span>0xC79BC0</span><i>click to copy</i></button><button class="sw" style="background:#8E6BBF" data-code="0x8E6BBF"><b>Grape</b><em>GRAPE</em><span>0x8E6BBF</span><i>click to copy</i></button><button class="sw dark" style="background:#6A5AAE" data-code="0x6A5AAE"><b>Twilight</b><em>TWILIGHT</em><span>0x6A5AAE</span><i>click to copy</i></button><button class="sw dark" style="background:#6B5B8C" data-code="0x6B5B8C"><b>Plum shadow</b><em>PLUM_SHADOW</em><span>0x6B5B8C</span><i>click to copy</i></button><button class="sw dark" style="background:#3F2F63" data-code="0x3F2F63"><b>Deep plum</b><em>DEEP_PLUM</em><span>0x3F2F63</span><i>click to copy</i></button></div>
<script>
document.querySelectorAll('.sw').forEach(b=>b.addEventListener('click',()=>{
  const t=b.querySelector('i');
  const done=()=>{t.textContent='copied!';setTimeout(()=>t.textContent='click to copy',1200)};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(b.dataset.code).then(done,()=>{t.textContent=b.dataset.code});
  else{const a=document.createElement('textarea');a.value=b.dataset.code;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();done()}
}));
</script></body></html>
